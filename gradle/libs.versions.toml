[versions]
ktor = "3.6.0"
sykepengerGradlePlugins = "20261001.1830"

[libraries]
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kafka-clients = "org.apache.kafka:kafka-clients:4.3.1"
opentelemetry-api = "io.opentelemetry:opentelemetry-api:1.66.0"
logback-syslog4j = "com.papertrailapp:logback-syslog4j:1.0.0"

sykepengerLibs-logging = "no.nav.sykepenger.libs:logging:20261001.1823"

[bundles]
ktor-server = [
    "ktor-server-auth",
    "ktor-server-auth-jwt",
    "ktor-server-cio",
    "ktor-server-core"
]

[plugins]
sykepenger-deployable = { id = "no.nav.sykepenger.deployable", version.ref = "sykepengerGradlePlugins" }
